<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBPLL</title>
    <meta name="description" content="Web Browser Physical Levels List">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <nav class="nav">
        <a class="brandlink" href="#">
            <img class="logo" src="favicon.png" alt="">
            <span class="brand">WBPLL</span>
        </a>
        <span class="links">
            <a href="index.html" class="active">Leaderboard</a>
            <a href="submit.html">Submit a level</a>
            <a href="records.html">Submit a record</a>
            <a href="banners.html">Submit a banner</a>
        </span>
        <span class="nav-account" id="navAccount"></span>
    </nav>

    <div id="leaderboardView">
        <div class="list-switch" id="listSwitch"></div>
        <div class="shell">
            <aside>
                <div class="level-list" id="levelList"></div>
            </aside>
            <main>
                <article class="hero">
                    <div class="hero-top">
                        <div>
                            <h1 class="hero-title" id="heroTitle">—</h1>
                            <div class="hero-sub">
                                <span class="pub">Published by <b id="heroPub">—</b></span>
                                <span class="id-badge">ID: <span id="heroId">—</span></span>
                            </div>
                        </div>
                        <div class="hero-meta-top">
                            Level made in <span id="heroVersion">2.2</span><br>
                            Uploaded: <span id="heroUploaded">—</span>
                        </div>
                    </div>
                    <div class="hero-media" id="heroMedia"></div>
                    <div class="hero-foot">Verifier: <b id="heroVerifier">—</b></div>
                    <div class="records" id="heroRecords"></div>
                </article>
            </main>
        </div>
    </div>

    <!-- The list comes from Supabase; there is no local copy of it. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="notifications.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
